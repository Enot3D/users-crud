[project]
name = "crud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Enot3D", email = "labsenot@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
crud = "crud:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
